[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aurora-finetuning"
version = "0.1.0"
description = "Research on Aurora weather forecasting with KNMI observations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "microsoft-aurora>=1.7,<2",
    "requests>=2.32,<3",
    "xarray>=2025.1,<2027",
]

[project.scripts]
aurora-finetuning = "aurora_finetuning.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_finetuning"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
netcdf4 = ">=1.7,<2"

[tool.pixi.pypi-dependencies]
aurora-finetuning = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
ruff = ">=0.14,<1"
mypy = ">=1.18,<2"
pytest = ">=8,<10"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
format = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check ."
typecheck = "mypy src tests"
test = "pytest"
check = { depends-on = ["format-check", "lint", "typecheck", "test"] }
smoke = "python -c 'from aurora import AuroraSmallPretrained, Batch, Metadata; import torch, requests, xarray, netCDF4; print(\"Aurora and KNMI dependencies import successfully; PyTorch\", torch.__version__)'"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
